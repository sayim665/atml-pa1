method: cdan
seed: 6304
domain_loss_weight: 1.0
grl_schedule: "2/(1+exp(-10p)) - 1"
lr: 0.0001
weight_decay: 0.0001
max_epochs: 30
early_stop_patience: 5
batch_size_per_source_domain: 8
batch_size_target: 24
discriminator_hidden: 256
discriminator_dropout: 0.5
multilinear_map: "vec(f (x) p), no entropy conditioning, no detach"
note: "L2-normalizes the multilinear map before the discriminator (same fix applied to DANN after an observed training instability); classifier head is unaffected."
